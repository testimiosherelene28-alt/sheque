<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Queueing System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="overlay"></div>
    
    <main class="queue-container">
        <!-- Header & Logo -->
        <header class="queue-header">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>QueueFlow</span>
            </div>
            <p>Real-time Queue Management System</p>
        </header>

        <!-- Main Display Panel -->
        <section class="display-card">
            <h2><i class="fa-solid fa-bullhorn"></i> Now Serving</h2>
            <div class="number-display pulse-animation" id="current-number">--</div>
            <div class="counter-info">Go to Counter <span id="counter-id">1</span></div>
        </section>

        <!-- Queue Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <i class="fa-solid fa-users"></i>
                <div class="stat-details">
                    <small>Next In Line</small>
                    <strong id="next-number">--</strong>
                </div>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-clock"></i>
                <div class="stat-details">
                    <small>Total Waiting</small>
                    <strong id="waiting-count">0</strong>
                </div>
            </div>
        </div>

        <!-- Action Controls -->
        <section class="control-actions">
            <button class="btn btn-primary" onclick="issueTicket()">
                <i class="fa-solid fa-ticket"></i> Get Ticket
            </button>
            <button class="btn btn-success" onclick="callNext()">
                <i class="fa-solid fa-forward"></i> Call Next
            </button>
            <button class="btn btn-danger" onclick="resetQueue()">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </section>
    </main>

    <script>
        // LocalStorage-based Queue Management (GitHub Pages Compatible)
        function getQueueData() {
            const data = localStorage.getItem('queueData');
            return data ? JSON.parse(data) : { last_issued: 0, current: 0, queue: [] };
        }

        function saveQueueData(data) {
            localStorage.setItem('queueData', JSON.stringify(data));
            renderQueue();
        }

        function renderQueue() {
            const data = getQueueData();
            
            document.getElementById('current-number').innerText = data.current ? `#${data.current}` : '--';
            document.getElementById('next-number').innerText = data.queue.length > 0 ? `#${data.queue[0]}` : '--';
            document.getElementById('waiting-count').innerText = data.queue.length;
        }

        function issueTicket() {
            const data = getQueueData();
            data.last_issued++;
            data.queue.push(data.last_issued);
            saveQueueData(data);
        }

        function callNext() {
            const data = getQueueData();
            if (data.queue.length > 0) {
                data.current = data.queue.shift(); // Remove first in line and set as current
                saveQueueData(data);
            }
        }

        function resetQueue() {
            const initialData = { last_issued: 0, current: 0, queue: [] };
            saveQueueData(initialData);
        }

        // Initialize display on page load
        renderQueue();
    </script>
</body>
</html>
